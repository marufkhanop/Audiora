{% if books %}
<ul class="stagger flex flex-col gap-0.5">
  {% for book in books %}
  <li>
    <a href="{% url 'book_detail' book.slug %}" hx-get="{% url 'book_detail' book.slug %}" hx-target="#main-content" hx-swap="innerHTML show:window:top" hx-push-url="true"
       class="group flex min-h-14 items-center gap-3 rounded-xl px-2 py-1.5 transition-colors hover:bg-gradient-to-r hover:from-violet-500/15 hover:to-fuchsia-500/5">
      <img src="{{ book.cover_url }}" alt="" class="h-11 w-11 rounded-lg object-cover ring-1 ring-white/10 transition-transform duration-300 group-hover:scale-105">
      <span class="min-w-0 flex-1">
        <span class="block truncate text-sm font-medium text-slate-100 group-hover:text-white">{{ book.title }}</span>
        <span class="block truncate text-xs text-slate-400">{{ book.author }}</span>
      </span>
      <span class="shrink-0 rounded-full bg-white/5 px-2 py-0.5 text-[11px] tabular-nums text-slate-400">{{ book.duration_hms }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="py-6 text-center text-sm text-slate-500">{% if q %}No matches for “{{ q }}”{% else %}Start typing to search{% endif %}</p>
{% endif %}
