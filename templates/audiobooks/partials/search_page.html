<section class="mx-auto max-w-[1600px] px-4 pt-8 sm:px-8">
  {% if q %}
  <p class="reveal text-[11px] font-semibold uppercase tracking-[0.18em] text-violet-300/80">Search</p>
  <h1 class="reveal reveal-1 font-display mt-2 text-3xl font-extrabold text-white sm:text-4xl">Results for <span class="text-gradient">“{{ q }}”</span></h1>
  <p class="reveal reveal-2 mt-2 text-sm text-slate-400">{{ books|length }} match{{ books|length|pluralize:"es" }}</p>
  {% else %}
  <p class="reveal text-[11px] font-semibold uppercase tracking-[0.18em] text-violet-300/80">Library</p>
  <h1 class="reveal reveal-1 font-display mt-2 text-3xl font-extrabold text-white sm:text-4xl">Find your next <span class="text-gradient">story</span></h1>
  <p class="reveal reveal-2 mt-2 max-w-md text-sm leading-relaxed text-slate-400">Search by title, author or narrator.</p>
  {% endif %}
  <div class="divider-grad mt-6"></div>
</section>
{% include "audiobooks/partials/browse.html" %}
