{% extends "admin/base.html" %}
{% load i18n static %}

{% block title %}{{ title }} · Audiora CMS{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}" style="display:inline-flex; align-items:center; gap:10px;">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="display:block; filter: drop-shadow(0 0 8px rgba(168,85,247,.6));">
      <defs>
        <linearGradient id="aud-admin-g" x1="0" y1="0" x2="22" y2="22" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#6366F1"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#D946EF"/>
        </linearGradient>
      </defs>
      <rect width="22" height="22" rx="6" fill="url(#aud-admin-g)"/>
      <rect x="5" y="8" width="2.5" height="6" rx="1.25" fill="#fff"/>
      <rect x="9.75" y="5" width="2.5" height="12" rx="1.25" fill="#fff"/>
      <rect x="14.5" y="9.5" width="2.5" height="5" rx="1.25" fill="#fff"/>
    </svg>
    <span class="aud-brand">Audiora CMS</span>
  </a>
</div>
<form method="post" action="{% url 'admin:audiobooks_audiobook_media_cleanup' %}" id="media-cleanup-form"
      onsubmit="return confirm('Delete unused media files and caches that are not referenced by any audiobook? This cannot be undone.');">
  {% csrf_token %}
  <button type="submit" id="media-cleanup-btn" title="Delete unused audio files, covers and caches">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    Clear unused media
  </button>
</form>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* Audiora admin theme — overrides Django's CSS variables only. */
  :root {
    --primary: #8B5CF6;
    --secondary: #6D28D9;
    --accent: #E879F9;
    --button-bg: #8B5CF6;
    --button-fg: #FFFFFF;
    --button-hover-bg: #A855F7;
    --default-button-bg: #7C3AED;
    --default-button-fg: #FFFFFF;
    --default-button-hover-bg: #A855F7;
    --header-bg: #0C0918;
    --header-color: #C4B5FD;
    --header-branding-color: #F5F3FF;
    --header-link-color: #D8B4FE;
    --link-fg: #7C3AED;
    --link-hover-color: #5B21B6;
    --link-selected-fg: #5B21B6;
    --breadcrumbs-bg: #1D1735;
    --breadcrumbs-fg: #A5A3C2;
    --breadcrumbs-link-fg: #D8B4FE;
    --body-quiet-color: #6B6785;
    --font-family-primary: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #header {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(90deg, #0C0918 0%, #1E1240 55%, #3B0F4A 100%);
    border-bottom: 1px solid transparent;
    border-image: linear-gradient(90deg, #6366F1, #A855F7, #D946EF) 1;
  }
  #site-name a { color: #F5F3FF; font-weight: 700; }
  .aud-brand {
    background: linear-gradient(90deg, #C4B5FD, #F0ABFC);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .button, input[type=submit], input[type=button], .submit-row input, a.button {
    border-radius: 8px;
    transition: background 150ms ease, box-shadow 150ms ease;
  }
  .submit-row input.default, input[type=submit].default {
    background: linear-gradient(135deg, #6366F1, #A855F7 60%, #D946EF);
    box-shadow: 0 6px 18px -8px rgba(168,85,247,.8);
  }
  #media-cleanup-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
    padding: 6px 14px;
    border: 1px solid rgba(192, 132, 252, .5);
    border-radius: 999px;
    background: rgba(139, 92, 246, .08);
    color: #E9D5FF;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
  }
  #media-cleanup-btn:hover {
    background: linear-gradient(135deg, #6366F1, #A855F7 60%, #D946EF);
    color: #fff;
    box-shadow: 0 6px 18px -8px rgba(168,85,247,.9);
  }
  .module h2, .module caption { letter-spacing: 0; }
  img[src*="/media/covers/"] { border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }

  /* Cloudinary storage panel */
  #cloudinary-panel { max-width: 520px; }
  #cloudinary-panel h2 { font-size: 13px; }
  .aud-cu-quota { padding: 10px 14px 4px; }
  .aud-cu-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .aud-cu-nums { color: var(--body-quiet-color); font-size: 12px; }
  .aud-cu-bar {
    height: 8px; margin: 8px 0 10px; border-radius: 999px;
    background: rgba(139, 92, 246, .12); overflow: hidden;
  }
  .aud-cu-fill {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #6366F1, #A855F7 60%, #D946EF);
    transition: width .4s ease;
  }
  .aud-cu-fill[style*="width: 100%"] { background: #EF4444; }
  #cloudinary-panel table { margin: 0; }
  .aud-cu-updated { padding: 6px 14px 10px; color: var(--body-quiet-color); font-size: 11.5px; }
  .aud-cu-note { padding: 10px 14px; color: var(--body-quiet-color); font-size: 12.5px; }

  @media (max-width: 767px) {
    #header { flex-wrap: wrap; row-gap: 8px; }
    #media-cleanup-btn { margin-left: 0; }
  }
</style>
<link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
{% endblock %}
