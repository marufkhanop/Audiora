<span class="relative inline-flex shrink-0">
  <span class="absolute inset-0 rounded-lg bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 opacity-60 blur-md transition-opacity duration-500 group-hover:opacity-100" aria-hidden="true"></span>
  <svg class="logo-mark relative" width="{{ size|default:28 }}" height="{{ size|default:28 }}" viewBox="0 0 22 22" aria-hidden="true">
    <defs>
      <linearGradient id="aud-logo-{{ size|default:28 }}" x1="0" y1="0" x2="22" y2="22" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#6366F1"/>
        <stop offset=".5" stop-color="#A855F7"/>
        <stop offset="1" stop-color="#D946EF"/>
      </linearGradient>
    </defs>
    <rect width="22" height="22" rx="6" fill="url(#aud-logo-{{ size|default:28 }})"/>
    <rect x="5" y="8" width="2.5" height="6" rx="1.25" fill="#fff"/>
    <rect x="9.75" y="5" width="2.5" height="12" rx="1.25" fill="#fff"/>
    <rect x="14.5" y="9.5" width="2.5" height="5" rx="1.25" fill="#fff"/>
  </svg>
</span>
